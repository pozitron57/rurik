<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="keywords" content="Родословная, Рюриковичи, генеалогия, князь, Русь">
  <meta name="description" content="Полная родословная Рюриковичей. Генеалогическое древо Рюриковичей. Все ветви до колена Ивана Грозного.">
  <title>Рюриковичи. Полная родословная.</title>

  <meta property="og:site_name" content="Лисаков и макромир"/>
  <meta property="og:image" content="https://lisakov.com/images/tree.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="400" />
  <meta property="og:image:height" content="300" />

  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">

  <!-- Pick the saved theme before the first paint, so a light-theme visitor
       never sees a dark flash. -->
  <script>
  (function () {
    try {
      var t = localStorage.getItem('rurik-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
  </script>

  <link href="treestyle.css" rel="stylesheet" type="text/css">
  <link rel="preload" href="jetbrainsmono-400.woff2" as="font" type="font/woff2" crossorigin>

  <script type="module" src="tree.js"></script>
</head>

<body>

<div id="stage">

  <div id="cam">
    <svg id="bands" width="0" height="0">
      <defs>
        <linearGradient id="bandFade" x1="0" y1="-44" x2="0" y2="0" gradientUnits="userSpaceOnUse">
          <stop offset="0"   stop-color="#151A24" stop-opacity="1"></stop>
          <stop offset="0.4" stop-color="#131822" stop-opacity="0.88"></stop>
          <stop offset="0.8" stop-color="#11151E" stop-opacity="0.74"></stop>
          <stop offset="1"   stop-color="#10141C" stop-opacity="0.66"></stop>
        </linearGradient>
      </defs>
      <g id="band-rects"></g>
    </svg>
    <svg id="wires" width="0" height="0"></svg>
    <div id="cards"></div>
  </div>

  <div id="strip">
    <div id="ruler"></div>
  </div>

  <div id="toolbar" class="panel">
    <button class="btn" id="btn-collapse" type="button">СВЕРНУТЬ</button>
    <button class="btn" id="btn-expand" type="button">РАСКРЫТЬ ВСЁ</button>
    <span class="sep"></span>
    <button class="btn" id="btn-fit" type="button">УМЕСТИТЬ</button>
    <span class="sep"></span>
    <button class="btn" id="btn-theme" type="button">ТЁМНАЯ ТЕМА</button>
    <span class="sep"></span>
    <a class="btn" href="/blog/rurik-pedigree/" title="Об авторах, истории создания, планах и обратной связи">О СТРАНИЦЕ</a>
    <span class="sep"></span>
    <span class="readout" title="Сколько человек сейчас на экране из всех, кто есть в древе">ПОКАЗАНО <span id="shown-n">0</span> / <span id="shown-all">0</span></span>
  </div>

  <div id="zoombar" class="panel">
    <button class="zbtn" id="btn-zoom-out" type="button" aria-label="Уменьшить">&minus;</button>
    <span id="zoom">100%</span>
    <button class="zbtn" id="btn-zoom-in" type="button" aria-label="Увеличить">+</button>
  </div>

  <div id="hint" class="panel">
    КЛИК —
    <span class="gens-wrap"><button type="button" id="gens" class="gens-btn" aria-haspopup="listbox" aria-expanded="false" title="Сколько колен раскрывать по щелчку. Колесо мыши над списком тоже меняет число."><span id="gens-val">2</span><svg class="caret" viewBox="0 0 10 6" aria-hidden="true" focusable="false"><path d="M0 0h10L5 6z"/></svg></button><ul id="gens-list" class="panel" role="listbox" hidden></ul></span>
    <span id="gens-word">КОЛЕНА</span><span class="mouse-only"> · SHIFT — ВЕТВЬ</span><br class="mouse-only">
    <span class="mouse-only">ПРАВЫЙ КЛИК — СПРЯТАТЬ · КОЛЕСО — МАСШТАБ</span>
  </div>

  <div id="tip">
    <div id="tip-name"></div>
    <div id="tip-meta"></div>
  </div>

</div>

</body>
</html>
