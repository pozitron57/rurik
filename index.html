<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="keywords" content="Родословная, Рюриковичи, генеалогия, князь, Русь">
  <meta name="description" content="Полная родословная Рюриковичей. Генеалогическое древо Рюриковичей. Все ветви до колена Ивана Грозного.">
  <title>Рюриковичи. Полная родословная.</title>

  <meta property="og:site_name" content="Лисаков и макромир"/>
  <meta property="og:image" content="https://lisakov.com/images/tree.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="400" />
  <meta property="og:image:height" content="300" />

  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">

  <!-- Pick the saved theme before the first paint, so a light-theme visitor
       never sees a dark flash. -->
  <script>
  (function () {
    try {
      var t = localStorage.getItem('rurik-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
  </script>

  <link href="treestyle.css" rel="stylesheet" type="text/css">
  <link rel="preload" href="jetbrainsmono-400.woff2" as="font" type="font/woff2" crossorigin>

  <script type="module" src="tree.js"></script>
</head>

<body>

<div id="stage">

  <div id="cam">
    <svg id="bands" width="0" height="0">
      <defs>
        <linearGradient id="bandFade" x1="0" y1="-44" x2="0" y2="0" gradientUnits="userSpaceOnUse">
          <!-- The colours are in treestyle.css, so the wash turns over with the
               rest of the palette. Only the ramp is fixed here. -->
          <stop offset="0"   stop-opacity="1"></stop>
          <stop offset="0.4" stop-opacity="0.88"></stop>
          <stop offset="0.8" stop-opacity="0.74"></stop>
          <stop offset="1"   stop-opacity="0.66"></stop>
        </linearGradient>
      </defs>
      <g id="band-rects"></g>
    </svg>
    <svg id="wires" width="0" height="0"></svg>
    <div id="cards"></div>
  </div>

  <div id="strip">
    <div id="ruler"></div>
  </div>

  <!-- On a phone the buttons scroll sideways inside .bar-scroll; the generations
       picker is moved out here beside it, so its dropdown is not clipped by
       that scroller. On a wider screen .bar-scroll is display:contents and the
       buttons are plain children of the panel. -->
  <div id="toolbar" class="panel">
    <div class="bar-scroll">
      <button class="btn" id="btn-collapse" type="button">СВЕРНУТЬ</button>
      <button class="btn" id="btn-expand" type="button">РАСКРЫТЬ ВСЁ</button>
      <span class="sep"></span>
      <button class="btn" id="btn-fit" type="button">УМЕСТИТЬ</button>
      <span class="sep"></span>
      <button class="btn" id="btn-theme" type="button" title="Переключить светлую и тёмную тему">
        <svg class="theme-icon icon-moon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M13.6 10.3A6.1 6.1 0 0 1 5.7 2.4a6.1 6.1 0 1 0 7.9 7.9z"/></svg>
        <svg class="theme-icon icon-sun" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="3.1"/><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M8 1.1v1.7M8 13.2v1.7M14.9 8h-1.7M2.8 8H1.1M12.9 3.1l-1.2 1.2M4.3 11.7l-1.2 1.2M12.9 12.9l-1.2-1.2M4.3 4.3L3.1 3.1"/></g></svg>
        <span class="wide-only"><span class="if-light">ТЁМНАЯ ТЕМА</span><span class="if-dark">СВЕТЛАЯ ТЕМА</span></span>
      </button>
      <span class="sep"></span>
      <a class="btn" href="/blog/rurik-pedigree/" title="Об авторах, истории создания, планах и обратной связи">О<span class="wide-only">&nbsp;СТРАНИЦЕ</span></a>
      <span class="sep"></span>
      <span class="readout" title="Сколько человек сейчас на экране из всех, кто есть в древе">ПОКАЗАНО <span id="shown-n">0</span> / <span id="shown-all">0</span></span>
    </div>
  </div>

  <div id="zoombar" class="panel">
    <button class="zbtn" id="btn-zoom-out" type="button" aria-label="Уменьшить">&minus;</button>
    <span id="zoom">100%</span>
    <button class="zbtn" id="btn-zoom-in" type="button" aria-label="Увеличить">+</button>
  </div>

  <div id="hint" class="panel">
    <span id="gens-ctl"><span class="wide-only">КЛИК — </span><span class="gens-wrap"><button type="button" id="gens" class="gens-btn" aria-haspopup="listbox" aria-expanded="false" title="Сколько колен раскрывать по щелчку. Колесо мыши над списком тоже меняет число."><span id="gens-val">2</span><svg class="caret" viewBox="0 0 10 6" aria-hidden="true" focusable="false"><path d="M0 0h10L5 6z"/></svg></button><ul id="gens-list" class="panel" role="listbox" hidden></ul></span> <span id="gens-word">КОЛЕНА</span></span><span class="mouse-only"> · SHIFT — ВЕТВЬ</span><br class="mouse-only">
    <span class="mouse-only">ПРАВЫЙ КЛИК — СПРЯТАТЬ · КОЛЕСО — МАСШТАБ</span>
  </div>

  <div id="tip">
    <div id="tip-name"></div>
    <div id="tip-meta"></div>
  </div>

</div>

</body>
</html>
